
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Takshak Café | Digital Menu</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f2;
      color: #20352a;
    }
    header {
      background: #174d35;
      color: white;
      padding: 28px 18px;
      text-align: center;
    }
    header h1 { margin: 0 0 8px; }
    header p { margin: 0; color: #d7eadb; }
    main { max-width: 760px; margin: auto; padding: 18px; }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d3ddd4;
      border-radius: 10px;
      font-size: 16px;
    }
    #categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 16px 0;
    }
    button {
      cursor: pointer;
      border: 0;
      border-radius: 9px;
      padding: 10px 14px;
      background: #e4ebe3;
      color: #174d35;
      white-space: nowrap;
    }
    button.active, .add {
      background: #174d35;
      color: white;
    }
    #menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }
    .item {
      background: white;
      padding: 16px;
      border-radius: 14px;
      box-shadow: 0 3px 12px #20352a0c;
    }
    .emoji { font-size: 44px; }
    .item h3 { margin: 8px 0; }
    .item p { color: #68746c; font-size: 14px; }
    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .price { font-weight: bold; font-size: 18px; }
    .unavailable { color: #b42318; font-size: 13px; }
    #cart {
      margin-top: 22px;
      padding: 18px;
      background: white;
      border-radius: 14px;
    }
    #status {
      padding: 10px;
      border-radius: 8px;
      background: #e4ebe3;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🌿 Takshak Café</h1>
    <p>Fresh Food • Great Taste • Good Vibes</p>
    <p style="margin-top:12px">DIGITAL MENU</p>
  </header>

  <main>
    <p id="status">Loading menu...</p>
    <input id="search" placeholder="Search food or drinks..." />
    <div id="categories"></div>
    <div id="menu"></div>

    <section id="cart">
      <h2>🛒 Your Order</h2>
      <div id="cartItems">No items added yet.</div>
      <h3 id="total">Total: ₹0</h3>
      <button id="clearCart">Clear order</button>
    </section>
    <p style="text-align:center;color:#68746c;font-size:12px">
      Digital menu demo
    </p>
  </main>

  <script type="module">
    import { db } from "./firebase.js";
    import {
      collection, getDocs
    } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

    const restaurantId = "takshak-cafe";
    let foods = [];
    let selected = "All";
    let cart = {};

    const status = document.getElementById("status");
    const menu = document.getElementById("menu");
    const categoriesEl = document.getElementById("categories");
    const search = document.getElementById("search");

    const emojiFor = category => ({
      Snacks: "🍔",
      Meals: "🍛",
      Drinks: "🥤",
      Desserts: "🍰"
    }[category] || "🍽️");

    function renderCategories() {
      const categories = ["All", ...new Set(foods.map(f => f.category))];
      categoriesEl.innerHTML = "";
      categories.forEach(category => {
        const button = document.createElement("button");
        button.textContent = category;
        button.className = selected === category ? "active" : "";
        button.onclick = () => {
          selected = category;
          renderCategories();
          renderMenu();
        };
        categoriesEl.appendChild(button);
      });
    }

    function renderMenu() {
      const query = search.value.trim().toLowerCase();
      const filtered = foods.filter(f =>
        (selected === "All" || f.category === selected) &&
        f.name.toLowerCase().includes(query)
      );

      menu.innerHTML = "";

      if (!filtered.length) {
        menu.textContent = "No menu items found.";
        return;
      }

      filtered.forEach(food => {
        const article = document.createElement("article");
        article.className = "item";

        const emoji = document.createElement("div");
        emoji.className = "emoji";
        emoji.textContent = emojiFor(food.category);

        const name = document.createElement("h3");
        name.textContent = food.name;

        const category = document.createElement("p");
        category.textContent = food.category;

        const row = document.createElement("div");
        row.className = "price-row";

        const price = document.createElement("span");
        price.className = "price";
        price.textContent = `₹${food.price}`;

        row.appendChild(price);

        if (food.available) {
          const add = document.createElement("button");
          add.className = "add";
          add.textContent = "Add +";
          add.onclick = () => {
            cart[food.id] = (cart[food.id] || 0) + 1;
            renderCart();
          };
          row.appendChild(add);
        } else {
          const unavailable = document.createElement("span");
          unavailable.className = "unavailable";
          unavailable.textContent = "Out of stock";
          row.appendChild(unavailable);
        }

        article.append(emoji, name, category, row);
        menu.appendChild(article);
      });
    }

    function renderCart() {
      const cartItems = document.getElementById("cartItems");
      cartItems.innerHTML = "";
      let total = 0;

      for (const [id, quantity] of Object.entries(cart)) {
        const food = foods.find(f => f.id === id);
        if (!food) continue;

        total += food.price * quantity;
        const line = document.createElement("p");
        line.textContent =
          `${food.name} × ${quantity} — ₹${food.price * quantity}`;
        cartItems.appendChild(line);
      }

      if (!cartItems.children.length) {
        cartItems.textContent = "No items added yet.";
      }

      document.getElementById("total").textContent = `Total: ₹${total}`;
    }

    document.getElementById("clearCart").onclick = () => {
      cart = {};
      renderCart();
    };

    search.addEventListener("input", renderMenu);

    async function loadMenu() {
      try {
        const menuRef = collection(
          db, "restaurants", restaurantId, "menu"
        );
        const snapshot = await getDocs(menuRef);

        foods = snapshot.docs.map(doc => {
          const data = doc.data();
          return {
            id: doc.id,
            name: String(data.name || "Unnamed item"),
            category: String(data.category || "Other"),
            price: Number(data.price || 0),
            available: data.available === true
          };
        });

        renderCategories();
        renderMenu();
        status.textContent = `Menu loaded: ${foods.length} item(s)`;
      } catch (error) {
        console.error("Menu loading failed:", error);
        status.textContent =
          `Could not load menu (${error.code || "unknown error"}).`;
      }
    }

    loadMenu();
  </script>
</body>
</html>
